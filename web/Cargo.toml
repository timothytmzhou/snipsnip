[package]
name = "prefixspace-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prefixspace = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
